<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 업로드</title>
    <style>
      :root {
        --bg: #f4f7ff;
        --panel: #ffffff;
        --text: #16213e;
        --muted: #52607a;
        --accent: #2563eb;
        --accent-2: #0ea5e9;
        --danger: #dc2626;
        --ok: #059669;
        --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
        color: var(--text);
        min-height: 100vh;
        background:
          radial-gradient(circle at 12% 12%, #c7d7ff, transparent 42%),
          radial-gradient(circle at 88% 4%, #dff2ff, transparent 35%),
          linear-gradient(180deg, #f9fbff 0%, #eef2ff 100%);
      }
      .page {
        width: min(980px, calc(100% - 2.5rem));
        margin: 2rem auto;
      }
      .title {
        margin: 0;
        font-size: 1.9rem;
        letter-spacing: -0.03em;
      }
      .card {
        margin-top: 1rem;
        background: var(--panel);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 1.4rem;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        margin-bottom: 1rem;
      }
      label {
        font-size: 0.9rem;
        font-weight: 700;
      }
      input[type="file"],
      input[readonly] {
        width: 100%;
        border: 1px solid #c8d0e0;
        border-radius: 10px;
        padding: 0.65rem 0.75rem;
        font-size: 0.95rem;
        background: #fff;
      }
      .hint {
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.35;
      }
      button {
        border: none;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        color: #fff;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
      }
      .status {
        border-radius: 10px;
        margin-top: 1rem;
        padding: 0.8rem;
        min-height: 56px;
        white-space: pre-wrap;
        font-size: 0.94rem;
        border: 1px dashed #b6c1d6;
        background: #f8fafc;
        color: #334155;
      }
      .status.ok {
        background: #ecfdf5;
        color: var(--ok);
        border: 1px solid #a7f3d0;
      }
      .status.err {
        background: #fef2f2;
        color: var(--danger);
        border: 1px solid #fecaca;
      }
      .result-list {
        margin: 0.5rem 0 0;
        padding-left: 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      a { color: #1d4ed8; }
      .copy {
        margin-top: 0.75rem;
        display: inline-flex;
        gap: 0.6rem;
        align-items: center;
      }
      .copy button {
        width: auto;
        padding: 0.45rem 0.7rem;
        background: #111827;
      }
      .copy span {
        font-size: 0.84rem;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1 class="title">AI 업로드</h1>
      <section class="card">
        <div class="field">
          <label for="fileInput">업로드할 파일</label>
          <input id="fileInput" type="file" accept=".html,.htm" />
          <p class="hint">선택 파일의 이름과 관계없이 저장 경로는 <strong>AI/MMDD/index.html</strong>입니다.</p>
        </div>
        <button id="uploadBtn" type="button">업로드</button>
        <div id="status" class="status"></div>
        <div id="result" class="result-list"></div>
        <div class="copy">
          <button id="copyPathBtn" type="button" style="display:none;">목표 경로 복사</button>
          <span id="copyLabel"></span>
        </div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);

      const GITHUB_CONFIG = {
        owner: "dicacros-gif",
        repo: "dicacros-gif",
        branch: "main",
        rootFolder: "AI",
        fileName: "index.html",
        token: "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",
      };
      const GH_API_VERSION = "2022-11-28";
      const GH_AUTH_HEADER = `token ${GITHUB_CONFIG.token}`;

      const FILE_NAME_TARGET = `${GITHUB_CONFIG.fileName}`;

      function pad2(v) {
        return String(v).padStart(2, "0");
      }

      function getDateFolder() {
        const now = new Date();
        try {
          const fmt = new Intl.DateTimeFormat("en-US", {
            timeZone: "Asia/Seoul",
            month: "2-digit",
            day: "2-digit",
          });
          const p = fmt.formatToParts(now);
          const mm = p.find((x) => x.type === "month")?.value || pad2(now.getMonth() + 1);
          const dd = p.find((x) => x.type === "day")?.value || pad2(now.getDate());
          return `${mm}${dd}`;
        } catch {
          return `${pad2(now.getMonth() + 1)}${pad2(now.getDate())}`;
        }
      }

      function encodePath(path) {
        return path.split("/").map((s) => encodeURIComponent(s)).join("/");
      }

      function setStatus(message, level = "") {
        const el = $("status");
        el.className = `status${level ? ` ${level}` : ""}`;
        el.textContent = message || "";
      }

      function getTargetPath() {
        return `${GITHUB_CONFIG.rootFolder}/${getDateFolder()}/${FILE_NAME_TARGET}`;
      }

      function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const raw = String(reader.result || "");
            const idx = raw.indexOf(",");
            if (idx < 0) {
              reject(new Error("파일 변환 실패"));
              return;
            }
            resolve(raw.substring(idx + 1).replace(/\r?\n/g, ""));
          };
          reader.onerror = () => reject(new Error("파일 읽기 실패"));
          reader.readAsDataURL(file);
        });
      }

      async function getSha(path) {
        const res = await fetch(
          `https://api.github.com/repos/${encodeURIComponent(GITHUB_CONFIG.owner)}/${encodeURIComponent(GITHUB_CONFIG.repo)}/contents/${encodePath(path)}?ref=${encodeURIComponent(
            GITHUB_CONFIG.branch
          )}`,
          {
            headers: {
              Accept: "application/vnd.github+json",
              "X-GitHub-Api-Version": GH_API_VERSION,
              Authorization: GH_AUTH_HEADER,
            },
          }
        );

        if (res.status === 404) return null;
        if (!res.ok) {
          const text = await res.text();
          throw new Error(`기존 파일 확인 실패: ${res.status} ${res.statusText} (${text})`);
        }
        const json = await res.json();
        return json?.sha || null;
      }

      function friendlyUploadError(err) {
        const msg = String(err.message || "");
        if (msg.includes("401") || msg.includes("Bad credentials")) {
          return "토큰이 유효하지 않거나 권한이 없습니다. (401 Bad credentials)\n현재 사용 중인 토큰을 확인하고 'repo' 또는 fine-grained의 Contents:Write 권한이 있는지 확인해 주세요.";
        }
        return msg;
      }

      async function validateToken() {
        const res = await fetch("https://api.github.com/user", {
          headers: {
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": GH_API_VERSION,
            Authorization: GH_AUTH_HEADER,
          },
        });
        if (!res.ok) {
          const text = await res.text();
          if (res.status === 401) {
            throw new Error(`기존 파일 확인 실패: 401 (Bad credentials) (${text})`);
          }
          throw new Error(`토큰 확인 실패: ${res.status} ${res.statusText} (${text})`);
        }
        return res.json();
      }

      async function uploadFile() {
        const file = $("fileInput").files?.[0];
        const result = $("result");
        const copyBtn = $("copyPathBtn");
        const copyLabel = $("copyLabel");

        result.innerHTML = "";
        copyBtn.style.display = "none";
        copyLabel.textContent = "";

        if (!file) {
          setStatus("업로드할 파일을 선택해 주세요.", "err");
          return;
        }

        if (!GITHUB_CONFIG.token) {
          setStatus("GitHub 토큰이 설정되지 않았습니다.", "err");
          return;
        }

        const targetPath = getTargetPath();
        setStatus("업로드 중입니다...");

        try {
          await validateToken();
          const content = await readFileAsBase64(file);
          const sha = await getSha(targetPath);

          const payload = {
            message: `Upload ${FILE_NAME_TARGET} to ${targetPath}`,
            content,
            branch: GITHUB_CONFIG.branch,
          };
          if (sha) payload.sha = sha;

          const res = await fetch(
            `https://api.github.com/repos/${encodeURIComponent(GITHUB_CONFIG.owner)}/${encodeURIComponent(
              GITHUB_CONFIG.repo
            )}/contents/${encodePath(targetPath)}`,
            {
              method: "PUT",
              headers: {
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": GH_API_VERSION,
                Authorization: GH_AUTH_HEADER,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            }
          );

          if (!res.ok) {
            const text = await res.text();
            throw new Error(`업로드 실패: ${res.status} ${res.statusText} (${text})`);
          }

          const body = await res.json();
          const targetUrl = `https://github.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/blob/${GITHUB_CONFIG.branch}/${targetPath}`;
          const rawUrl = `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${encodePath(targetPath)}`;

          const links = [
            `<a href="${body.content?.html_url || targetUrl}" target="_blank" rel="noopener noreferrer">GitHub에서 확인</a>`,
            `<a href="${rawUrl}" target="_blank" rel="noopener noreferrer">raw 주소 보기</a>`,
          ];
          if (body.commit?.html_url) {
            links.push(`<a href="${body.commit.html_url}" target="_blank" rel="noopener noreferrer">커밋 보기</a>`);
          }

          setStatus("업로드가 완료되었습니다.", "ok");
          result.innerHTML = links.map((x) => `<div>${x}</div>`).join("");

          copyBtn.style.display = "inline-flex";
          copyBtn.dataset.path = targetPath;
          copyLabel.textContent = `복사 대상: ${targetPath}`;
          copyBtn.onclick = () => {
            const url = `https://github.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/blob/${GITHUB_CONFIG.branch}/${targetPath}`;
            navigator.clipboard.writeText(url);
            setStatus(`경로를 복사했습니다: ${targetPath}`, "ok");
          };
        } catch (error) {
          setStatus(friendlyUploadError(error), "err");
        }
      }

      $("uploadBtn").addEventListener("click", uploadFile);
    </script>
  </body>
</html>
