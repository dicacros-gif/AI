name: "Daily mobile AI startup index"

on:
  schedule:
    - cron: "0 22 * * *"  # 07:00 KST (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate daily index.html
        run: |
          set -euo pipefail
          folder="$(date -u +'%m%d')"
          folder="${folder#0}"
          mkdir -p "$folder"
          cat > "$folder/index.html" <<'EOF'
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily AI Startup Index</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 24px; background: #f7f9fc; color: #111827; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; vertical-align: top; }
      th { background: #e2e8f0; }
      h1 { font-size: 22px; margin-bottom: 10px; }
      .meta { color: #475569; margin-bottom: 16px; }
      .note { margin-top: 18px; color: #334155; }
    </style>
  </head>
  <body>
    <h1>AI 스타트업 스냅샷 (유니콘 미만, 글로벌, 모바일/폰 AI 활용)</h1>
    <div class="meta">생성일: $(date -u '+%Y-%m-%d')</div>
    <div class="meta">기준: 공개 데이터 기준(최신 공개 수치 우선), 피치북 가치 평가 공개치 반영</div>
    <table>
      <thead>
        <tr>
          <th>회사</th>
          <th>설립년</th>
          <th>본사</th>
          <th>밸류에이션</th>
          <th>매출/ARR</th>
          <th>예상치</th>
          <th>MAU/가입자</th>
          <th>영업이익</th>
          <th>핵심 모델</th>
          <th>핵심 코멘트</th>
          <th>참고</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Inferact</td>
          <td>2025</td>
          <td>San Francisco, CA, US</td>
          <td>미디어/보도: 약 8억 달러</td>
          <td>공개 미공개</td>
          <td>공개 미공개</td>
          <td>공개 미공개</td>
          <td>공개 미공개</td>
          <td>vLLM 기반 AI 인퍼런스 인프라(온프레미스/클라우드 배포 지원)</td>
          <td>오픈소스 성능 우위(저비용·고성능 추론)와 수요 확대가 강점</td>
          <td>CB Insights, LinkedIn, TechCrunch</td>
        </tr>
        <tr>
          <td>Micro1</td>
          <td>2022</td>
          <td>Palo Alto, CA, US</td>
          <td>약 5억 달러 (Dealroom/보도)</td>
          <td>ARR 50M~100M(공개 인터뷰 기준)</td>
          <td>단기 가이던스 미공개</td>
          <td>공개 미공개</td>
          <td>공개 미공개</td>
          <td>AI 모델용 고품질 인간 레이블링/전문가 운영 플랫폼</td>
          <td>초기 고성장 단계, AI 훈련 파이프라인 의존형 수요 증가 구간</td>
          <td>CB Insights, Dealroom, TechCrunch</td>
        </tr>
        <tr>
          <td>Emergent</td>
          <td>2025</td>
          <td>San Francisco, CA, US</td>
          <td>약 3억 달러(보도 기준)</td>
          <td>50M ARR (수개월 내 100M+ 도달 보고)</td>
          <td>예상: 100M+ ARR(2026 목표/공개 발표)</td>
          <td>5M+ 사용자</td>
          <td>공개 미공개</td>
          <td>모바일/웹 앱 빌드 AI 에이전트 플랫폼(개발자·비개발자)</td>
          <td>폰/웹 앱 생성 자동화 수요와 멀티에이전트 아키텍처로 확장성 확보</td>
          <td>TechCrunch, Y Combinator, App Store</td>
        </tr>
        <tr>
          <td>Pomo</td>
          <td>2026</td>
          <td>미공개(US/Singapore 보도 혼재)</td>
          <td>공개 미공개</td>
          <td>공개 미공개</td>
          <td>공개 미공개</td>
          <td>공개 미공개</td>
          <td>공개 미공개</td>
          <td>AI 광고/마케팅 의사결정 자동화 플랫폼(광고 채널 모니터링 및 실행 권고)</td>
          <td>모바일 광고 운영 의사결정용으로 적합한 초기 성장형 후보</td>
          <td>BusinessInsider, MapCo</td>
        </tr>
      </tbody>
    </table>
    <div class="note">주의: 경영진 이름/학교/주요 경력은 공개 프로필/보도 기준으로 최신 공개만 반영. 미공개 항목은 향후 공시 재확인 필요.</div>
  </body>
</html>
EOF

      - name: Auto commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: publish daily mobile AI startup index"
          file_pattern: "**/index.html"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
