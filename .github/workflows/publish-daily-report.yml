name: Publish Daily AI Startup Watch

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional Asia/Seoul date in YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-ai-startup-watch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily folder
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: python scripts/publish_daily_report.py

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish daily AI startup watch for $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
