  ai2_render_staging:
    needs: [context, ai2_score]
    if: always() && needs.context.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce GitHub-hosted runtime
        run: python scripts/enforce_server_only.py
      - name: Generate agent assets
        run: python scripts/generate_codex_assets.py
      - name: Download prior artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ai-watch-state-${{ needs.context.outputs.run_date }}-*
          path: _artifacts
      - name: Restore prior state
        run: python scripts/restore_phase_artifacts.py --artifact-root _artifacts --repo-root .
      - name: Bootstrap ai2_render_staging
        continue-on-error: true
        run: python scripts/run_phase.py --mode bootstrap --phase ai2_render_staging --run-date "${{ needs.context.outputs.run_date }}"
      - name: Run Codex ai2_render_staging
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: .codex
          prompt-file: .github/codex/prompts/ai2_render.md
          working-directory: .
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-file: .state/runs/${{ needs.context.outputs.run_date }}/ai2/ai2_render_staging/codex.final.md
          model: gpt-5.4
          effort: high
      - name: Consolidate ai2_render_staging
        continue-on-error: true
        run: python scripts/run_phase.py --mode consolidate --phase ai2_render_staging --run-date "${{ needs.context.outputs.run_date }}"
      - name: Upload ai2 render artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-watch-state-${{ needs.context.outputs.run_date }}-ai2_render_staging
          path: .state/runs/${{ needs.context.outputs.run_date }}/ai2/ai2_render_staging
          if-no-files-found: warn

  global_recency_recheck:
    needs: [context, ai1_render_staging, ai2_render_staging]
    if: always() && needs.context.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce GitHub-hosted runtime
        run: python scripts/enforce_server_only.py
      - name: Download prior artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ai-watch-state-${{ needs.context.outputs.run_date }}-*
          path: _artifacts
      - name: Restore prior state
        run: python scripts/restore_phase_artifacts.py --artifact-root _artifacts --repo-root .
      - name: Execute global_recency_recheck
        continue-on-error: true
        run: python scripts/run_phase.py --mode execute --phase global_recency_recheck --run-date "${{ needs.context.outputs.run_date }}"
      - name: Upload recency artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-watch-state-${{ needs.context.outputs.run_date }}-global_recency_recheck
          path: .state/runs/${{ needs.context.outputs.run_date }}/global/global_recency_recheck
          if-no-files-found: warn

  global_qa:
    needs: [context, global_recency_recheck]
    if: always() && needs.context.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce GitHub-hosted runtime
        run: python scripts/enforce_server_only.py
      - name: Generate agent assets
        run: python scripts/generate_codex_assets.py
      - name: Download prior artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ai-watch-state-${{ needs.context.outputs.run_date }}-*
          path: _artifacts
      - name: Restore prior state
        run: python scripts/restore_phase_artifacts.py --artifact-root _artifacts --repo-root .
      - name: Bootstrap global_qa
        continue-on-error: true
        run: python scripts/run_phase.py --mode bootstrap --phase global_qa --run-date "${{ needs.context.outputs.run_date }}"
      - name: Run Codex global_qa
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: .codex
          prompt-file: .github/codex/prompts/global_qa.md
          working-directory: .
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-file: .state/runs/${{ needs.context.outputs.run_date }}/global/global_qa/codex.final.md
          model: gpt-5.4
          effort: high
      - name: Consolidate global_qa
        continue-on-error: true
        run: python scripts/run_phase.py --mode consolidate --phase global_qa --run-date "${{ needs.context.outputs.run_date }}"
      - name: Upload global QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-watch-state-${{ needs.context.outputs.run_date }}-global_qa
          path: .state/runs/${{ needs.context.outputs.run_date }}/global/global_qa
          if-no-files-found: warn

  repair_retry:
    needs: [context, global_qa]
    if: always() && needs.context.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce GitHub-hosted runtime
        run: python scripts/enforce_server_only.py
      - name: Download prior artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ai-watch-state-${{ needs.context.outputs.run_date }}-*
          path: _artifacts
      - name: Restore prior state
        run: python scripts/restore_phase_artifacts.py --artifact-root _artifacts --repo-root .
      - name: Execute repair_retry
        continue-on-error: true
        run: python scripts/run_phase.py --mode execute --phase repair_retry --run-date "${{ needs.context.outputs.run_date }}"
      - name: Upload retry artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-watch-state-${{ needs.context.outputs.run_date }}-repair_retry
          path: .state/runs/${{ needs.context.outputs.run_date }}/global/repair_retry
          if-no-files-found: warn

  publish_if_changed:
    needs: [context, global_qa, repair_retry]
    if: always() && needs.context.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce GitHub-hosted runtime
        run: python scripts/enforce_server_only.py
      - name: Download prior artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ai-watch-state-${{ needs.context.outputs.run_date }}-*
          path: _artifacts
      - name: Restore prior state
        run: python scripts/restore_phase_artifacts.py --artifact-root _artifacts --repo-root .
      - name: Execute publish_if_changed phase
        continue-on-error: true
        run: python scripts/run_phase.py --mode execute --phase publish_if_changed --run-date "${{ needs.context.outputs.run_date }}"
      - name: Validate ranking
        continue-on-error: true
        run: |
          python scripts/validate_ranking.py 1/index.html 2/index.html \
            --json-output ".state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed/validator_ranking.json"
      - name: Validate publish targets
        continue-on-error: true
        run: |
          python scripts/validate_publish.py \
            --page1 1/index.html \
            --page2 2/index.html \
            --json-output ".state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed/validator_publish.json"
      - name: Validate state tree
        continue-on-error: true
        run: |
          python scripts/validate_state.py \
            --run-root ".state/runs/${{ needs.context.outputs.run_date }}" \
            --json-output ".state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed/validator_state.json"
      - name: Validate sources
        continue-on-error: true
        run: |
          python scripts/validate_sources.py \
            ".state/runs/${{ needs.context.outputs.run_date }}/ai1/ai1_update/source_quality_report.json" \
            ".state/runs/${{ needs.context.outputs.run_date }}/ai1/ai1_verify/source_integrity.json" \
            ".state/runs/${{ needs.context.outputs.run_date }}/ai1/ai1_scout/scout_candidates.json" \
            ".state/runs/${{ needs.context.outputs.run_date }}/ai1/ai1_score/scores.json" \
            ".state/runs/${{ needs.context.outputs.run_date }}/ai2/ai2_update/source_quality_report.json" \
            ".state/runs/${{ needs.context.outputs.run_date }}/ai2/ai2_verify/source_integrity.json" \
            ".state/runs/${{ needs.context.outputs.run_date }}/ai2/ai2_scout/scout_candidates.json" \
            ".state/runs/${{ needs.context.outputs.run_date }}/ai2/ai2_score/scores.json" \
            ".state/runs/${{ needs.context.outputs.run_date }}/global/global_qa/global_qa.json" \
            --json-output ".state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed/validator_sources.json"
      - name: Validate daily intelligence work
        continue-on-error: true
        run: |
          python scripts/validate_daily_intel.py \
            --run-root ".state/runs/${{ needs.context.outputs.run_date }}" \
            --json-output ".state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed/validator_daily_intel.json"
      - name: Summarize failures
        run: |
          python scripts/report_failures.py \
            ".state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed/validator_ranking.json" \
            ".state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed/validator_publish.json" \
            ".state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed/validator_state.json" \
            ".state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed/validator_sources.json" \
            ".state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed/validator_daily_intel.json" \
            --json-output ".state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed/failure_summary.json"
      - name: Enforce publish gate
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          summary = json.loads(Path(".state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed/failure_summary.json").read_text(encoding="utf-8"))
          sys.exit(1 if summary.get("summary") else 0)
          PY
      - name: Ensure quiet-day page delta
        run: |
          if git diff --quiet -- 1/index.html 2/index.html; then
            echo "No rendered page delta; stamping the daily review checkpoint."
            python scripts/stamp_daily_review.py \
              --page 1/index.html \
              --page 2/index.html
          fi
      - name: Commit rendered pages if changed
        run: |
          if git diff --quiet -- 1/index.html 2/index.html; then
            echo "Full daily run still produced no publishable page delta after fallback."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1/index.html 2/index.html
          git commit -m "ai-watch: publish ${{ needs.context.outputs.run_date }}"
          git push
      - name: Upload publish artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-watch-state-${{ needs.context.outputs.run_date }}-publish_if_changed
          path: .state/runs/${{ needs.context.outputs.run_date }}/global/publish_if_changed
          if-no-files-found: warn

  post_publish_smoke:
    needs: [context, publish_if_changed]
    if: always() && needs.context.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce GitHub-hosted runtime
        run: python scripts/enforce_server_only.py
      - name: Download prior artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ai-watch-state-${{ needs.context.outputs.run_date }}-*
          path: _artifacts
      - name: Restore prior state
        run: python scripts/restore_phase_artifacts.py --artifact-root _artifacts --repo-root .
      - name: Execute post_publish_smoke
        continue-on-error: true
        run: python scripts/run_phase.py --mode execute --phase post_publish_smoke --run-date "${{ needs.context.outputs.run_date }}"
      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-watch-state-${{ needs.context.outputs.run_date }}-post_publish_smoke
          path: .state/runs/${{ needs.context.outputs.run_date }}/global/post_publish_smoke
          if-no-files-found: warn

  persist_state:
    needs: [context, manual_single_phase, ai1_render_staging, ai2_render_staging, global_qa, publish_if_changed, post_publish_smoke]
    if: always() && (needs.manual_single_phase.result == 'success' || needs.ai1_render_staging.result == 'success' || needs.ai2_render_staging.result == 'success' || needs.global_qa.result == 'success' || needs.publish_if_changed.result == 'success' || needs.post_publish_smoke.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download all phase artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ai-watch-state-${{ needs.context.outputs.run_date }}-*
          path: _artifacts
      - name: Restore state tree
        run: python scripts/restore_phase_artifacts.py --artifact-root _artifacts --repo-root .
      - name: Persist state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ai-watch-state || true
          rm -rf _state_branch
          if git ls-remote --exit-code --heads origin ai-watch-state >/dev/null 2>&1; then
            git worktree add _state_branch origin/ai-watch-state
          else
            git worktree add --detach _state_branch
            cd _state_branch
            git checkout --orphan ai-watch-state
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi
          mkdir -p "_state_branch/.state/runs"
          rm -rf "_state_branch/.state/runs/${{ needs.context.outputs.run_date }}"
          mkdir -p "_state_branch/.state/runs"
          cp -R ".state/runs/${{ needs.context.outputs.run_date }}" "_state_branch/.state/runs/"
          cd _state_branch
          git add .state/runs/${{ needs.context.outputs.run_date }}
          git commit -m "state: ${{ needs.context.outputs.run_date }}" || echo "No state changes to commit."
          git push origin HEAD:ai-watch-state
