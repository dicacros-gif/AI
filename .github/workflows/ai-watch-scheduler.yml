      - name: Bootstrap ai2_score
        continue-on-error: true
        run: python scripts/run_phase.py --mode bootstrap --phase ai2_score --run-date "${{ needs.context.outputs.run_date }}"
      - name: Run Codex ai2_score
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: .codex
          prompt-file: .github/codex/prompts/ai2_score.md
          working-directory: .
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-file: .state/runs/${{ needs.context.outputs.run_date }}/ai2/ai2_score/codex.final.md
          model: gpt-5.4
          effort: high
      - name: Consolidate ai2_score
        continue-on-error: true
        run: python scripts/run_phase.py --mode consolidate --phase ai2_score --run-date "${{ needs.context.outputs.run_date }}"
      - name: Upload ai2 score artifact
