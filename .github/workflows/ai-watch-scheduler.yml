name: AI Watch Orchestrator

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ai-watch-scheduler.yml
      - .github/codex/prompts/**
      - AGENTS.md
      - scripts/**
  schedule:
    # 00:05 KST primary run. GitHub schedule cron is kept in UTC for predictable triggering.
    - cron: "5 15 * * *"
    # 07:05 KST rescue run. This catches dropped/delayed primary runs and quiet no-diff days.
    - cron: "5 22 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: "Run the full orchestrator or one specific phase"
        required: true
        default: all
        type: choice
        options:
          - all
          - preflight_source_health
          - ai1_source_freshness_probe
          - ai1_update
          - ai1_verify
          - ai1_scout
          - ai1_entity_resolution
          - ai1_evidence_normalize
          - ai1_claim_ledger_build
          - ai1_candidate_verify
          - ai1_staleness_gate
          - ai1_score
          - ai1_render_staging
          - ai2_source_freshness_probe
          - ai2_update
          - ai2_verify
          - ai2_scout
          - ai2_entity_resolution
          - ai2_evidence_normalize
          - ai2_claim_ledger_build
          - ai2_candidate_verify
          - ai2_staleness_gate
          - ai2_score
          - ai2_render_staging
          - global_recency_recheck
          - global_qa
          - repair_retry
          - publish_if_changed
          - post_publish_smoke
      target_date:
        description: "Optional KST date in YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: read

env:
  TZ: Asia/Seoul
  AI_WATCH_SERVER_ONLY: "true"

concurrency:
  group: daily-ai-intel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.meta.outputs.run_date }}
      single_phase: ${{ steps.meta.outputs.single_phase }}
      full_run: ${{ steps.meta.outputs.full_run }}
    steps:
      - id: meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          target = os.environ.get("TARGET_DATE", "").strip()
          phase = os.environ.get("TARGET_PHASE", "all").strip() or "all"
          if not target:
              target = datetime.now(ZoneInfo("Asia/Seoul")).strftime("%Y-%m-%d")
          print(f"run_date={target}")
          print(f"single_phase={'' if phase == 'all' else phase}")
          print(f"full_run={'true' if phase == 'all' else 'false'}")
          PY
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          TARGET_PHASE: ${{ inputs.phase }}

  manual_single_phase:
    needs: context
    if: needs.context.outputs.single_phase != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce GitHub-hosted runtime
        run: python scripts/enforce_server_only.py
      - name: Generate agent assets
        run: python scripts/generate_codex_assets.py
      - id: resolve
        run: |
          python scripts/resolve_schedule.py \
            --manual-phase "${{ needs.context.outputs.single_phase }}" \
            --manual-date "${{ needs.context.outputs.run_date }}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Download prior artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ai-watch-state-${{ needs.context.outputs.run_date }}-*
          path: _artifacts
      - name: Restore prior state
        run: python scripts/restore_phase_artifacts.py --artifact-root _artifacts --repo-root .
      - name: Bootstrap codex phase
        if: steps.resolve.outputs.should_run_codex == 'true'
        run: |
          python scripts/run_phase.py \
            --mode bootstrap \
            --phase "${{ steps.resolve.outputs.phase }}" \
            --run-date "${{ needs.context.outputs.run_date }}"
      - name: Run Codex
        if: steps.resolve.outputs.should_run_codex == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: .codex
          prompt-file: ${{ steps.resolve.outputs.prompt_file }}
          working-directory: .
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-file: ${{ steps.resolve.outputs.phase_root }}/codex.final.md
          model: gpt-5.4
          effort: high
      - name: Consolidate codex phase
        if: steps.resolve.outputs.should_run_codex == 'true'
        run: |
          python scripts/run_phase.py \
            --mode consolidate \
            --phase "${{ steps.resolve.outputs.phase }}" \
            --run-date "${{ needs.context.outputs.run_date }}"
      - name: Execute script phase
        if: steps.resolve.outputs.should_run_codex != 'true'
        run: |
          python scripts/run_phase.py \
            --mode execute \
            --phase "${{ steps.resolve.outputs.phase }}" \
            --run-date "${{ needs.context.outputs.run_date }}"
      - name: Upload phase artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-watch-state-${{ needs.context.outputs.run_date }}-${{ steps.resolve.outputs.phase }}
          path: ${{ steps.resolve.outputs.phase_root }}
          if-no-files-found: warn

  preflight_source_health:
    needs: context
    if: needs.context.outputs.full_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce GitHub-hosted runtime
        run: python scripts/enforce_server_only.py
      - name: Generate agent assets
        run: python scripts/generate_codex_assets.py
      - name: Execute preflight
        run: python scripts/run_phase.py --mode execute --phase preflight_source_health --run-date "${{ needs.context.outputs.run_date }}"
      - name: Upload preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-watch-state-${{ needs.context.outputs.run_date }}-preflight_source_health
          path: .state/runs/${{ needs.context.outputs.run_date }}/global/preflight_source_health
